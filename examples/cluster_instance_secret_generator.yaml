# An example of a ClusterInstanceSecretGenerator.
#
# This is the cluster scoped form of InstanceSecretGenerator. The namespaced kind is kept and
# behaves identically; use whichever suits the cluster.
#
# It manages the shape of one of Zitadel's generated codes.
#
# A secret generator belongs to no organization and to no namespace:
# a namespace here implies a separation that does not exist.
#
# A cluster scoped resource cannot name a secret in a namespace, so it
# references a ClusterProviderConfig, whose credential references say which
# namespace their secret is in.
apiVersion: zitadel.crossplane.io/v1alpha1
kind: ClusterInstanceSecretGenerator
metadata:
  name: cluster-instance-secret-generator
spec:
  providerConfigRef:
    name: zitadel
    kind: ClusterProviderConfig
  forProvider:
    # Which of Zitadel's codes this shapes. Each type is a generator of its own,
    # so a second one of these may manage a different type at the same time.
    generatorType: SECRET_GENERATOR_TYPE_INIT_CODE
    # Zitadel refuses a length below four.
    length: 6
    # How long the code stays usable, as a Go duration.
    expiry: 5m
    # The four flags together have to spell at least one character class.
    includeLowerLetters: true
    includeUpperLetters: false
    includeDigits: true
    includeSymbols: false
