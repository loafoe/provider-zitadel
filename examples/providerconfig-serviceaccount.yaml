# A ProviderConfig authenticating with a Zitadel service account (machine user)
# key. Create the key by:
#
#   1. Creating a machine user in the Zitadel console under
#      "Service accounts", or with a ServiceAccount managed resource.
#   2. Adding a key to it and downloading the key.json file.
#   3. Storing the file content in a Kubernetes secret:
#
#      kubectl -n crossplane-system create secret generic zitadel-sa \
#        --from-file=key.json=./key.json \
#        --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Namespace
metadata:
  name: zitadel
---
apiVersion: zitadel.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: zitadel
  namespace: zitadel
spec:
  url: https://auth.internal.loafoe.com
  credentials:
    source: Secret
    authType: ServiceAccount
    serviceAccount:
      keySecretRef:
        name: zitadel-sa
        key: key.json
