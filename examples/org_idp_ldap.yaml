# An identity provider that lets users sign in against a directory server.
#
# It belongs to one organization. Zitadel refuses to remove a provider that is
# still offered on a login page, so it has to be unbound from the login policy
# first.
#
# Zitadel does not report this kind's settings back, so they are applied once at
# creation and are not drift detected: changing one means deleting the provider
# and making it again. Only the name, the state and whether it registers users
# automatically are compared.
#
apiVersion: zitadel.m.crossplane.io/v1alpha1
kind: OrgIDPLDAP
metadata:
  name: example-ldap
  namespace: zitadel
spec:
  providerConfigRef: {name: zitadel, kind: ProviderConfig}
  forProvider:
    servers: ["ldap://ldap.example.com:389"]
    baseDN: "ou=people,dc=example,dc=com"
    userBase: "ou=people"
    userObjectClasses: ["inetOrgPerson"]
    userFilters: ["(objectClass=inetOrgPerson)"]
    bindPasswordSecretRef: {name: example-ldap-credentials, key: bindpassword}
    rootCASecretRef: {name: example-ldap-credentials, key: rootca}
    organizationRef: {name: platform}
    state: Active
#
# A credential is read from a secret rather than written here, and Zitadel
# never returns one either, so it is applied but never compared. Make the
# secret with a command like the one below, then point the references above
# at it.
#
#   kubectl -n zitadel create secret generic example-ldap-credentials \
#     --from-literal=bindpassword=... \
#     --from-literal=rootca=... \
