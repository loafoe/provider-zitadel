# An identity provider that lets users log in through any OpenID Connect provider.
#
# It is available to every organization that has not set up its own.
#
apiVersion: zitadel.m.crossplane.io/v1alpha1
kind: IDPOIDC
metadata:
  name: example-oidc
  namespace: zitadel
spec:
  providerConfigRef: {name: zitadel, kind: ProviderConfig}
  forProvider:
    issuer: "https://accounts.example.com"
    clientID: "my-client-id"
    scopes: ["openid", "email", "profile"]
    clientSecretSecretRef: {name: example-oidc-credentials, key: clientsecret}
    state: Active
#
# A credential is read from a secret rather than written here, and Zitadel
# never returns one either, so it is applied but never compared. Make the
# secret with a command like the one below, then point the references above
# at it.
#
#   kubectl -n zitadel create secret generic example-oidc-credentials \
#     --from-literal=clientsecret=... \
