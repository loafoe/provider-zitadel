# An example of a ClusterDefaultPasswordComplexityPolicy.
#
# This is the cluster scoped form of DefaultPasswordComplexityPolicy. The namespaced kind is kept and
# behaves identically; use whichever suits the cluster.
#
# It manages what a password must contain, instance wide.
#
# It is the instance default, so it exists once however it is scoped.
#
# A cluster scoped resource cannot name a secret in a namespace, so it
# references a ClusterProviderConfig, whose credential references say which
# namespace their secret is in.
apiVersion: zitadel.crossplane.io/v1alpha1
kind: ClusterDefaultPasswordComplexityPolicy
metadata:
  name: cluster-default-password-complexity-policy
spec:
  providerConfigRef: {name: zitadel, kind: ProviderConfig}
  forProvider:
    minLength: 12
    hasUppercase: true
    hasLowercase: true
    hasNumber: true
    hasSymbol: true
