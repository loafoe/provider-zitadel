---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: clusterproviderconfigs.zitadel.crossplane.io
spec:
  group: zitadel.crossplane.io
  names:
    categories:
    - crossplane
    - provider
    - zitadel
    kind: ClusterProviderConfig
    listKind: ClusterProviderConfigList
    plural: clusterproviderconfigs
    singular: clusterproviderconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    - jsonPath: .spec.url
      name: URL
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A ClusterProviderConfig configures a Zitadel provider for cluster scoped
          resources.

          It is the same configuration as a ProviderConfig, for the managed resources
          that live in the cluster scoped group: the ones managing state that belongs to
          a whole Zitadel instance rather than to a namespace. Those objects cannot name
          a namespaced secret, so the credential secret lives here alongside them.

          A namespaced resource may reference one of these too, which is the way to
          share a single configuration across namespaces.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterProviderConfigSpec is the configuration of a ClusterProviderConfig.

              It is the ProviderConfig configuration with one difference, which the scope
              forces: the credential secret is named with its namespace, because a cluster
              scoped object has no namespace of its own to look one up in.
            properties:
              credentials:
                description: Credentials contains the authentication configuration
                  for Zitadel.
                properties:
                  authType:
                    description: AuthType specifies which Zitadel service account
                      credential is used.
                    enum:
                    - ServiceAccount
                    - Token
                    type: string
                  serviceAccount:
                    description: ServiceAccount holds the machine key of a Zitadel
                      service account.
                    properties:
                      keySecretRef:
                        description: |-
                          KeySecretRef references the secret key holding the JSON encoded machine key
                          of a Zitadel service account, i.e. the key file downloaded from the
                          Zitadel console.

                          It names a namespace because the configuration is cluster scoped: there is
                          no namespace of its own to look the secret up in, so it has to say where
                          the secret lives.
                        properties:
                          key:
                            description: The key to select.
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                    required:
                    - keySecretRef
                    type: object
                  source:
                    default: Secret
                    description: Source of the provider credentials.
                    enum:
                    - None
                    - Secret
                    type: string
                  token:
                    description: Token holds the Personal Access Token of a Zitadel
                      service account.
                    properties:
                      tokenSecretRef:
                        description: |-
                          TokenSecretRef references the secret key holding the Personal Access Token
                          of a Zitadel service account.

                          It names a namespace, for the same reason as above.
                        properties:
                          key:
                            description: The key to select.
                            type: string
                          name:
                            description: Name of the secret.
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                    required:
                    - tokenSecretRef
                    type: object
                required:
                - authType
                - source
                type: object
              insecure:
                default: false
                description: |-
                  Insecure disables TLS when talking to the Zitadel API. Only useful for
                  local development instances without TLS.
                type: boolean
              insecureSkipTLSVerify:
                default: false
                description: |-
                  InsecureSkipTLSVerify skips verification of the Zitadel server
                  certificate. Only useful for instances using a self signed certificate.
                type: boolean
              organizationID:
                description: |-
                  OrganizationID sets the organization context (`x-zitadel-orgid`) used for
                  all API calls that do not carry an explicit organization ID.
                type: string
              url:
                description: |-
                  URL is the base URL of the Zitadel instance, i.e. the issuer of the
                  instance. The gRPC API endpoint is derived from it (`<host>:443`, or
                  `<host>:80` when insecure is enabled).
                type: string
            required:
            - credentials
            - url
            type: object
          status:
            description: A ClusterProviderConfigStatus defines the status of a ClusterProviderConfig.
            properties:
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              users:
                description: Users of this provider configuration.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
