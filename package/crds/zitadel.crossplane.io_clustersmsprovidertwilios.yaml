---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: clustersmsprovidertwilios.zitadel.crossplane.io
spec:
  group: zitadel.crossplane.io
  names:
    categories:
    - zitadel
    kind: ClusterSMSProviderTwilio
    listKind: ClusterSMSProviderTwilioList
    plural: clustersmsprovidertwilios
    singular: clustersmsprovidertwilio
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterSMSProviderTwilio is the cluster scoped form of SMSProviderTwilio.

          It manages the Twilio account Zitadel sends SMS through.

          Zitadel sends through one of these, so two namespaced copies would
          be fighting over the same provider.

          The namespaced kind is kept and behaves identically. Use whichever suits the
          cluster: a namespaced one to keep instance configuration beside the team or
          environment that owns it, this one when it should be unambiguous.

          It references a ClusterProviderConfig, because a cluster scoped object cannot
          name a secret in a namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterSMSProviderTwilioSpec is the desired state of a ClusterSMSProviderTwilio.

              It carries the same parameters as the namespaced SMSProviderTwilio, so the two kinds
              cannot describe a different thing from one another.
            properties:
              forProvider:
                description: SMSProviderTwilioParameters is the desired configuration
                  of a Zitadel Twilio SMS provider.
                properties:
                  description:
                    description: Description controls the following. What this provider
                      is for, shown in the Zitadel console
                    type: string
                  senderNumber:
                    description: SenderNumber controls the following. The number messages
                      are sent from, in E.164 form such as `+441234567890`
                    type: string
                  sid:
                    description: |-
                      SID controls the following. The Twilio account SID

                      It is required: Zitadel cannot do without it.
                    type: string
                  state:
                    description: |-
                      State is whether Zitadel sends through this provider. Empty leaves
                      Zitadel's own choice, which is to send through it.
                    type: string
                  tokenSecretRef:
                    description: TokenSecretRef controls the following. The Twilio
                      auth token. Zitadel never returns it and sets it through a call
                      of its own, so it is applied and then left alone. It is a secret
                      rather than a field so that it is not readable by anyone who
                      can read this object
                    properties:
                      key:
                        description: Key inside the secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace of the secret.

                          A namespaced resource leaves this empty and the secret is read from the
                          resource's own namespace. A cluster scoped resource has no namespace to
                          fall back on, so it must say here which namespace the secret is in.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  verifyServiceSID:
                    description: VerifyServiceSID controls the following. The SID
                      of a Twilio Verify service, when messages go through one rather
                      than through the account directly
                    type: string
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: SMSProviderTwilioStatus reports the observed state of a Zitadel
              Twilio SMS provider.
            properties:
              atProvider:
                description: AtProvider is the observed state.
                properties:
                  description:
                    type: string
                  id:
                    type: string
                  kind:
                    type: string
                  senderNumber:
                    type: string
                  sid:
                    type: string
                  state:
                    type: string
                  verifyServiceSID:
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
