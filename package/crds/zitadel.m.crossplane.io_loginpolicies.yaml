                    description: |-
                      AllowDomainDiscovery lets a login name without a domain be matched
                      against verified domains.
                    type: boolean
                  allowExternalIDP:
                    description: AllowExternalIDP allows login through an upstream
                      identity provider.
                    type: boolean
                  allowRegister:
                    description: AllowRegister allows users to register themselves.
                    type: boolean
                  allowUsernamePassword:
                    description: AllowUsernamePassword allows login with a username
                      and password.
                    type: boolean
                  defaultRedirectURI:
                    description: DefaultRedirectURI is where a login lands when no
                      redirect is requested.
                    type: string
                  disableLoginWithEmail:
                    description: DisableLoginWithEmail disables login with an email
                      address.
                    type: boolean
                  disableLoginWithPhone:
                    description: DisableLoginWithPhone disables login with a phone
                      number.
                    type: boolean
                  externalLoginCheckLifetime:
                    description: |-
                      ExternalLoginCheckLifetime is how long an upstream IdP link stays valid,
                      e.g. "8760h".
                    type: string
                  forceMFA:
                    description: ForceMFA requires multi factor authentication for
                      every user.
                    type: boolean
                  forceMFALocalOnly:
                    description: ForceMFALocalOnly requires MFA also for federated
                      logins.
                    type: boolean
                  hidePasswordReset:
                    description: HidePasswordReset hides the password reset option
