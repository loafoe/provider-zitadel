              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EmailProviderSMTPSpec defines the desired state of a EmailProviderSMTP.
            properties:
              forProvider:
                description: EmailProviderSMTPParameters is the desired configuration
                  of a Zitadel SMTP email provider.
                properties:
                  description:
                    description: Description controls the following. What this provider
                      is for, shown in the Zitadel console
                    type: string
                  host:
                    description: |-
                      Host controls the following. The SMTP server, as `host:port`, such as `smtp.example.com:587`. Zitadel does not connect to it when the provider is added, only when something is sent, so it can be set up ahead of a server that is not reachable yet

                      It is required: Zitadel cannot do without it.
                    type: string
                  passwordSecretRef:
                    description: 'PasswordSecretRef controls the following. That account''s
                      password. Zitadel never returns it, so it is applied and then
                      left alone: an update that carries none leaves the stored password
                      as it is. It is a secret rather than a field so that it is not
                      readable by anyone who can read this object'
                    properties:
                      key:
                        description: Key inside the secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace of the secret.

                          A namespaced resource leaves this empty and the secret is read from the
                          resource's own namespace. A cluster scoped resource has no namespace to
                          fall back on, so it must say here which namespace the secret is in.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  replyToAddress:
                    description: ReplyToAddress controls the following. Where a reply
                      should go, when that is not the sender address
                    type: string
                  senderAddress:
                    description: SenderAddress controls the following. The address
                      Zitadel sends from, such as `noreply@example.com`. It has to
                      be a domain the organization owns
                    type: string
                  senderName:
                    description: SenderName controls the following. The name shown
                      as the sender of an email Zitadel sends
                    type: string
                  state:
                    description: |-
                      State is whether Zitadel sends through this provider. Empty leaves
                      Zitadel's own choice, which is to send through it.
                    type: string
                  tls:
                    description: 'TLS controls the following. Connect over TLS. Zitadel
                      calls this `tls` rather than `starttls`: it means the connection
                      is wrapped from the start, which is what port 465 expects'
                    type: boolean
                  user:
                    description: User controls the following. The account Zitadel
                      authenticates to the server as
                    type: string
                type: object
              managementPolicies:
