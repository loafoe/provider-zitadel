                    type: string
                  jwtEndpoint:
                    description: JWTEndpoint, KeysEndpoint and HeaderName are reported
                      for a JWT provider.
                    type: string
                  keysEndpoint:
                    type: string
                  name:
                    description: Name of the provider.
                    type: string
                  organizationID:
                    description: |-
                      OrganizationID is the organization the provider belongs to. Empty for an
                      instance wide provider.
                    type: string
                  scope:
                    description: Scope is the organization the provider was last read
