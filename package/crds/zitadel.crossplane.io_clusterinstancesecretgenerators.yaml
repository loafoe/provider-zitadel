    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterInstanceSecretGenerator is the cluster scoped form of InstanceSecretGenerator.

          It manages the shape of one of Zitadel's generated codes.

          A secret generator belongs to no organization and to no namespace: a
          namespace here implies a separation that does not exist.

          The namespaced kind is kept and behaves identically. Use whichever suits the
          cluster: a namespaced one to keep instance configuration beside the team or
          environment that owns it, this one when it should be unambiguous.

          It references a ClusterProviderConfig, because a cluster scoped object cannot
          name a secret in a namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterInstanceSecretGeneratorSpec is the desired state of a ClusterInstanceSecretGenerator.

              It carries the same parameters as the namespaced InstanceSecretGenerator, so the two kinds
              cannot describe a different thing from one another.
            properties:
              forProvider:
                description: InstanceSecretGeneratorParameters is the desired configuration
                  of a Zitadel instance secret generator.
                properties:
                  expiry:
                    description: |-
                      Expiry controls the following. How long the code stays usable, as a Go duration such as `5m` or `1h`. Zitadel refuses an expiry that is longer than the code's own lifetime

                      It is optional.
                    type: string
                  generatorType:
                    description: |-
                      GeneratorType controls the following. Which of Zitadel's codes this shapes, such as `SECRET_GENERATOR_TYPE_INIT_CODE` or `SECRET_GENERATOR_TYPE_APP_SECRET`. Each type is a generator of its own, so two of these resources may manage two different types at once

                      It is required.
                    type: string
                  includeDigits:
                    description: |-
                      IncludeDigits controls the following. Let the code contain digits

                      It is optional.
                    type: boolean
                  includeLowerLetters:
                    description: |-
                      IncludeLowerLetters controls the following. Let the code contain lower case letters

                      It is optional.
                    type: boolean
                  includeSymbols:
                    description: |-
                      IncludeSymbols controls the following. Let the code contain symbols

                      It is optional.
                    type: boolean
                  includeUpperLetters:
                    description: |-
                      IncludeUpperLetters controls the following. Let the code contain upper case letters

                      It is optional.
                    type: boolean
                  length:
                    description: |-
                      Length controls the following. How many characters the code has. Zitadel refuses a length below four

                      It is optional.
                    format: int64
                    type: integer
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: InstanceSecretGeneratorStatus reports the observed state
              of a Zitadel instance secret generator.
            properties:
              atProvider:
                description: AtProvider is the observed state.
                properties:
                  expiry:
                    type: string
                  generatorType:
                    type: string
                  includeDigits:
                    type: boolean
                  includeLowerLetters:
                    type: boolean
                  includeSymbols:
                    type: boolean
                  includeUpperLetters:
                    type: boolean
                  length:
                    format: int64
                    type: integer
                  scope:
                    description: |-
                      Scope is what identifies these settings. It is empty for a
                      singleton and carries the generator type for the keyed kind.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
              restore:
                description: |-
                  Restore is the value this resource overwrote, kept so that deleting
                  it can put it back.
                format: byte
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
