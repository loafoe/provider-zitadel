    - zitadel
    kind: ClusterInstanceSecretGenerator
    listKind: ClusterInstanceSecretGeneratorList
    plural: clusterinstancesecretgenerators
    singular: clusterinstancesecretgenerator
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
