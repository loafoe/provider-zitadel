  names:
    categories:
    - zitadel
    kind: WebKey
    listKind: WebKeyList
    plural: webkeys
    singular: webkey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WebKey is a managed resource that hold one of Zitadel's own signing keys.

          Zitadel signs its tokens with one of these, and an application verifies
          them with the active one. The private half never leaves Zitadel, so a key
          this provider manages is an identity and a state and nothing more:

            - Zitadel creates it inactive, so it verifies nothing until activated.
              ActivatedWebKey is what does that.
            - The key type cannot be changed, only replaced, so changing the algorithm
              is reported as needing a new key rather than silently ignored.
            - Zitadel refuses to remove the active key, so it has to be activated
              away first.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WebKeySpec defines the desired state of a WebKey.
            properties:
              forProvider:
                description: WebKeyParameters is the desired configuration of a hold
                  one of Zitadel's own signing keys.
                properties:
                  algorithm:
                    description: Algorithm controls the following. `rsa`, `ecdsa`
                      or `ed25519`. Zitadel generates the key; the private half never
                      leaves it, so there is no material to supply or read back
                    type: string
                  rsaBits:
                    description: 'RSABits controls the following. The key size for
                      an RSA key: `RSA_BITS_2048`, `RSA_BITS_3072` or `RSA_BITS_4096`.
                      Zitadel''s default is 2048. Ignored for the other algorithms'
                    type: string
                  rsaHasher:
                    description: 'RSAHasher controls the following. The signing algorithm
                      for an RSA key: `RSA_HASHER_SHA256`, `RSA_HASHER_SHA384` or
                      `RSA_HASHER_SHA512`. Zitadel''s default is SHA256. Ignored for
                      the other algorithms'
                    type: string
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: WebKeyStatus reports the observed state of a hold one of
              Zitadel's own signing keys.
            properties:
              atProvider:
                description: AtProvider is the observed state.
                properties:
                  algorithm:
                    type: string
                  changeDate:
                    type: string
                  creationDate:
                    type: string
                  id:
                    type: string
                  state:
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
