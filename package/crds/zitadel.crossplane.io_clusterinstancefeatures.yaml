    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterInstanceFeatures is the cluster scoped form of InstanceFeatures.

          It manages the instance wide feature flags.

          It is the singleton of the instance, so two namespaced copies
          would be asking for the same flags and the second would win.

          The namespaced kind is kept and behaves identically. Use whichever suits the
          cluster: a namespaced one to keep instance configuration beside the team or
          environment that owns it, this one when it should be unambiguous.

          It references a ClusterProviderConfig, because a cluster scoped object cannot
          name a secret in a namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterInstanceFeaturesSpec is the desired state of a ClusterInstanceFeatures.

              It carries the same parameters as the namespaced InstanceFeatures, so the two kinds
              cannot describe a different thing from one another.
            properties:
              forProvider:
                description: InstanceFeaturesParameters is the desired configuration
                  of a Zitadel instance feature flags.
                properties:
                  debugOidcParentError:
                    description: |-
                      DebugOidcParentError controls the following. Return the underlying error to an OIDC client instead of a generic failure. It can reveal details about the system to anyone who asks, so it is meant for debugging rather than everyday use

                      It is optional.
                    type: boolean
                  improvedPerformance:
                    description: |-
                      ImprovedPerformance controls the following. Execution paths Zitadel may shortcut in exchange for less work on write. Accepted values are `IMPROVED_PERFORMANCE_PROJECT_GRANT`, `IMPROVED_PERFORMANCE_PROJECT`, `IMPROVED_PERFORMANCE_USER_GRANT` and `IMPROVED_PERFORMANCE_ORG_DOMAIN_VERIFIED`

                      It is optional.
                    items:
                      type: string
                    type: array
                  loginDefaultOrg:
                    description: |-
                      LoginDefaultOrg controls the following. Make the login screen use the default organization's settings when no organization context is set, rather than the organization's own

                      It is optional.
                    type: boolean
                  userSchema:
                    description: |-
                      UserSchema controls the following. Enable the user schema API, which manages a schema of extra data per user. The API is early and may change between Zitadel releases

                      It is optional.
                    type: boolean
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: InstanceFeaturesStatus reports the observed state of a Zitadel
              instance feature flags.
            properties:
              atProvider:
                description: AtProvider is the observed state.
                properties:
                  debugOidcParentError:
                    type: boolean
                  debugOidcParentErrorSource:
                    type: string
                  improvedPerformance:
                    items:
                      type: string
                    type: array
                  improvedPerformanceSource:
                    type: string
                  loginDefaultOrg:
                    type: boolean
                  loginDefaultOrgSource:
                    type: string
                  scope:
                    description: |-
                      Scope is what identifies these settings. It is empty for a
                      singleton and carries the generator type for the keyed kind.
                    type: string
                  userSchema:
                    type: boolean
                  userSchemaSource:
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
              restore:
                description: |-
                  Restore is the value this resource overwrote, kept so that deleting
                  it can put it back.
                format: byte
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
