    - zitadel
    kind: ClusterInstanceFeatures
    listKind: ClusterInstanceFeaturesList
    plural: clusterinstancefeatures
    singular: clusterinstancefeatures
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
