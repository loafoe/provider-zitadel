name: Renovate

on:
  pull_request:
    paths:
      - '.github/workflows/renovate.yaml'
      - '.github/renovate-config.js'
      - 'renovate.json'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        type: choice
        options: [info, debug]
        default: info

# Two runs at once fight over the same branches, and one of them aborts with
# "repository has changed during renovation". Let a second run wait instead.
concurrency:
  group: renovate
  cancel-in-progress: false

env:
  # Managed by the customManagers entry for it in renovate.json.
  RENOVATE_VERSION: 44.198.0

jobs:
  # A malformed renovate.json only shows up the next time the schedule fires,
  # so validate it on the pull request that changes it, against the same
  # Renovate version the scheduled run uses.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate configuration
        run: npx --yes --package renovate@${{ env.RENOVATE_VERSION }} renovate-config-validator renovate.json

  renovate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Renovate parks a new branch behind a "Pending" commit status while it
      # waits out minimumReleaseAge. Without this it cannot set that status, and
      # any failure there aborts the whole run - it reports "repository has
      # changed during renovation", which is not what went wrong.
      statuses: write
      # The action pins live in .github/workflows/*, and GitHub refuses a push
      # that edits a workflow file unless the push token may write workflows.
      # Without it the "github actions" and "ci tooling" groups fail to land.
      workflows: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.10
        with:
          renovate-version: ${{ env.RENOVATE_VERSION }}
          # A PAT (RENOVATE_TOKEN) is preferred when it is configured: PRs opened
          # with the default GITHUB_TOKEN do not trigger other workflows, so CI
          # would not run on Renovate's pull requests. Without the secret we
          # still work, just without checks on those PRs.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
          configurationFile: '.github/renovate-config.js'
        env:
          RENOVATE_ALLOW_SCRIPTS: true
          RENOVATE_SEPARATE_MAJOR_MINOR: false
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
