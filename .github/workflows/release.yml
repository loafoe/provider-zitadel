name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27'
  DOCKER_BUILDX_VERSION: 'v0.23.0'
  COSIGN_VERSION: 'v2.6.1'
  CRANE_VERSION: 'v0.20.6'
  IMAGE: ghcr.io/${{ github.repository_owner }}/provider-zitadel

jobs:
  # Builds the multi-arch Crossplane package (each platform's xpkg embeds its own
  # controller image), publishes it, signs it with a keyless cosign signature,
  # emits SLSA provenance, and finally promotes it to the stable channel.
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Push the package index to GHCR.
      packages: write
      # Keyless cosign signing and artifact attestations both need an OIDC token.
      id-token: write
      attestations: write

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.meta.outputs.digest }}

    steps:
      # QEMU is what makes the linux/arm64 image buildable on the runner. The
      # package is always published as a multi-arch image index covering
      # linux/amd64 and linux/arm64.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # crane is how the workflow resolves a tag to the immutable digest it
      # signs, and reads manifests. It is not preinstalled on the runner. The
      # Crossplane CLI needs no explicit install either: `make build` puts its
      # own copy in the tools cache.
      - name: Install crane
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cachedir=$(make go.cachedir)" >> "$GITHUB_OUTPUT"

      - name: Cache the Go Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go.outputs.cachedir }}
          key: ${{ runner.os }}-build-release-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-release-

      - name: Cache Go Dependencies
        uses: actions/cache@v4
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Download Go Modules
        run: make modules.download modules.check

      - name: Review the change
        run: make -j2 reviewable

      - name: Check that the build version matches the tag
        run: |
          set -euo pipefail
          version="$(make print-version)"
          echo "tag:    ${GITHUB_REF_NAME}"
          echo "build:  ${version}"
          if [ "${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The version the build machinery derived (${version}) does not match the pushed tag (${GITHUB_REF_NAME}). Refusing to publish a package under a tag that says one thing and contains another."
            exit 1
          fi

      - name: Build Artifacts
        run: make -j2 build.all
        env:
          BUILD_ARGS: "--load"

      # A GITHUB_TOKEN may only push to a GHCR package that is associated with
      # the repository this workflow runs in. The association is established by
      # the org.opencontainers.image.source label on an image pushed from this
      # repository, which `make publish` does first by publishing the labelled
      # controller image. If the package exists but was created from somewhere
      # else the token is refused with `denied: permission_denied: read_package`
      # before the label is ever looked at, so say so up front: a release must
      # actually reach the registry and this step is deliberately not allowed to
      # fail softly.
      - name: Note the GHCR package association
        run: |
          echo "::notice::Pushing ${IMAGE} associates it with ${GITHUB_REPOSITORY}. If this fails with permission_denied, the package was created outside of this repository: delete it at https://github.com/packages?package_type=container so the next run recreates it."

      - name: Publish Artifacts
        run: make publish BRANCH_NAME=${GITHUB_REF##*/}
        env:
          VERSION: ${{ github.ref_name }}
          XPKG_REG_ORGS: ghcr.io/${{ github.repository_owner }}

      - name: Resolve and record the package digest
        id: meta
        run: |
          set -euo pipefail
          digest="$(crane digest "${IMAGE}@${GITHUB_REF_NAME}")"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### provider-zitadel ${GITHUB_REF_NAME}"
            echo
            echo "Install with:"
            echo
            echo '```console'
            echo "crossplane xpkg install provider ${IMAGE}:${GITHUB_REF_NAME}"
            echo '```'
            echo
            echo "or with package signature verification enabled:"
            echo
            echo '```console'
            echo "kubectl apply -f examples/imageconfig-signature-verification.yaml"
            echo "crossplane xpkg install provider ${IMAGE}:${GITHUB_REF_NAME}"
            echo '```'
            echo
            echo "Digest: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Sign the image indexes, not the tags: a signature has to cover the exact
      # bytes a consumer pulls. The package signature is the one Crossplane
      # itself checks when package signature verification is enabled.
      - name: Sign the package and the controller image (keyless)
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          set -euo pipefail
          controller="${IMAGE}:controller-${GITHUB_REF_NAME}"
          controller_digest="$(crane digest "${controller}")"
          for ref in "${IMAGE}@${{ steps.meta.outputs.digest }}" "${controller}@${controller_digest}"; do
            echo "::group::Sign ${ref}"
            cosign sign --yes "${ref}"
            echo "::endgroup::"
            cosign verify \
              --certificate-identity "${CERT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${ref}"
          done
          echo "controller_digest=${controller_digest}" >> "$GITHUB_OUTPUT"
        id: sign

      - name: Attest the build provenance
        run: |
          set -euo pipefail
          cosign attest --yes --type slsaprovenance \
            "${IMAGE}:controller-${GITHUB_REF_NAME}@${{ steps.sign.outputs.controller_digest }}"

      - name: Verify both artifacts are multi-arch image indexes
        run: |
          set -euo pipefail
          hack/verify-multiarch.sh \
            "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:controller-${GITHUB_REF_NAME}"

      - name: Promote to the stable channel
        run: make -j2 promote BRANCH_NAME=${GITHUB_REF##*/}
        env:
          VERSION: ${{ github.ref_name }}
          CHANNEL: stable
          XPKG_REG_ORGS: ghcr.io/${{ github.repository_owner }}

      - name: Sign the promoted channels
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          set -euo pipefail
          for ref in \
            "${IMAGE}:stable" \
            "${IMAGE}:${GITHUB_REF_NAME}-stable" \
            "${IMAGE}:controller-stable" \
            "${IMAGE}:controller-${GITHUB_REF_NAME}-stable"; do
            echo "::group::Sign ${ref}"
            cosign sign --yes "${ref}@$(crane digest "${ref}")"
            cosign verify \
              --certificate-identity "${CERT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${ref}@$(crane digest "${ref}")"
            echo "::endgroup::"
          done

  # Proves that a consumer can verify the published package without any
  # repository-local knowledge beyond the workflow identity.
  verify:
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify the package signature
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/provider-zitadel
          TAG: ${{ needs.publish.outputs.tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          CERT_IDENTITY_REGEXP: ^https://github\.com/${{ github.repository_owner }}/provider-zitadel/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$
        run: |
          set -euo pipefail
          echo "Verifying ${IMAGE}@${DIGEST} against ${CERT_IDENTITY_REGEXP}"
          cosign verify \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
